services:
  attachment-downloader:
    build: .
    restart: unless-stopped
    user: "1029:100"
    extra_hosts:
      - "ibhelm.local:192.168.178.38"
    env_file:
      - .env
    environment:
      # PostgREST API (database operations)
      - POSTGREST_URL=${POSTGREST_URL}
      - MAD_SERVICE_SECRET=${MAD_SERVICE_SECRET}
      # Missive API
      - MISSIVE_API_TOKEN=${MISSIVE_API_TOKEN}
      # Storage — comma-separated list of mount paths to search for project folders
      - ATTACHMENT_STORAGE_PATHS=/data/projekte,/data/projekte-erledigt
      # Worker settings
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - BATCH_SIZE=${BATCH_SIZE:-10}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      # Filters
      - SKIP_SENDER_DOMAINS=${SKIP_SENDER_DOMAINS:-}
      - MAX_SUBJECT_LENGTH=${MAX_SUBJECT_LENGTH:-50}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BETTERSTACK_SOURCE_TOKEN=${BETTERSTACK_SOURCE_TOKEN:-}
      - BETTERSTACK_INGEST_HOST=${BETTERSTACK_INGEST_HOST:-}
    volumes:
      - /volume1/_shared-ibhelm/projekte:/data/projekte
      - /volume1/_shared-ibhelm/projekte-erledigt:/data/projekte-erledigt
      - ./logs:/app/logs
